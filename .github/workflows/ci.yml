name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libudev-dev libhidapi-dev \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libgtk-3-dev \
            libwayland-dev libseat-dev

      - name: Check (library crates only, no platform-specific features)
        run: cargo check -p strop-proto -p strop-profile -p strop-dsp -p strop-hid

      - name: Build (library crates)
        run: cargo build -p strop-proto -p strop-profile -p strop-dsp -p strop-hid

      - name: Test (library crates)
        run: cargo test -p strop-proto -p strop-profile -p strop-dsp -p strop-hid -- --test-threads=1

      - name: Clippy (library crates)
        run: cargo clippy -p strop-proto -p strop-profile -p strop-dsp -p strop-hid

      - name: Check binary (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo check -p strop

      - name: Build binary (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build -p strop

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libudev-dev libhidapi-dev \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libgtk-3-dev \
            libwayland-dev libseat-dev

      - name: Build release (library crates)
        run: cargo build --release -p strop-proto -p strop-profile -p strop-dsp -p strop-hid

      - name: Build release binary (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release -p strop

      - name: Upload binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v5
        with:
          name: strop-macos
          path: target/release/strop

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: strop-linux
          path: target/release/strop

      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: strop-windows
          path: target/release/strop.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/strop
            target/release/strop.exe
          generate_release_notes: true
