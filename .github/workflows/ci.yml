name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Library tests (all platforms) ──────────────────────────────
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --fix-missing \
            libudev-dev libhidapi-dev \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libgtk-3-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libatk1.0-dev \
            libwayland-dev libseat-dev

      - name: Check library crates
        run: cargo check -p strop-proto -p strop-profile -p strop-dsp -p strop-hid

      - name: Build library crates
        run: cargo build -p strop-proto -p strop-profile -p strop-dsp -p strop-hid

      - name: Test library crates
        run: cargo test -p strop-proto -p strop-profile -p strop-dsp -p strop-hid -- --test-threads=1

      - name: Check binary
        if: matrix.os == 'macos-latest'
        run: cargo check -p strop

  # ── Release build (tagged commits only) ────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]

    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: strop-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: strop-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: strop-windows-amd64.exe
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check release compiles
        run: cargo check --release -p strop

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --fix-missing \
            libudev-dev libhidapi-dev \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libgtk-3-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libatk1.0-dev \
            libwayland-dev libseat-dev

      - name: Build release binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }} -p strop

      - name: Prepare artifact
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/strop"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Determine if pre-release
        id: check
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "$TAG" | grep -qiE '-(alpha|beta|rc|dev|pre)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ── GitHub Release (single job, waits for all release builds) ─
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Determine pre-release flag
        id: check
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "$TAG" | grep -qiE '-(alpha|beta|rc|dev|pre)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE.md
          prerelease: ${{ steps.check.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/strop-macos-arm64/strop-macos-arm64
            artifacts/strop-linux-amd64/strop-linux-amd64
            artifacts/strop-windows-amd64.exe/strop-windows-amd64.exe
